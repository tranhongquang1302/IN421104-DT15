name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore LangCenter.sln
      - run: dotnet build LangCenter.sln --configuration Release --no-restore
      - name: Test and collect coverage
        run: >-
          dotnet test LangCenter.sln --configuration Release --no-build
          --settings coverlet.runsettings --collect "XPlat Code Coverage"
          --logger "trx;LogFileName=langcenter.trx" --results-directory TestResults
      - name: Summarize coverage
        shell: pwsh
        run: |
          $file = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          [xml]$report = Get-Content -LiteralPath $file.FullName -Raw
          $lines = [int]$report.coverage.'lines-covered'
          $lineTotal = [int]$report.coverage.'lines-valid'
          $branches = [int]$report.coverage.'branches-covered'
          $branchTotal = [int]$report.coverage.'branches-valid'
          @(
              '## LangCenter code coverage'
              ''
              ('- Lines {0:P1} ({1}/{2})' -f ($lines / $lineTotal), $lines, $lineTotal)
              ('- Branches {0:P1} ({1}/{2})' -f ($branches / $branchTotal), $branches, $branchTotal)
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: langcenter
          POSTGRES_PASSWORD: langcenter-ci
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U langcenter -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LANGCENTER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=langcenter;Password=langcenter-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test LangCenter.sln --configuration Release --filter FullyQualifiedName~Postgres
