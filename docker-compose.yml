services:
  api:
    build:
      context: .
      dockerfile: LangCenter.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrations: "true"
      JwtSettings__SigningKey: "${LANGCENTER_JWT_SIGNING_KEY:-}"
      DevelopmentAccounts__Password: "${LANGCENTER_DEMO_PASSWORD:-}"
      CertificateLinks__PublicBaseUrl: "${LANGCENTER_CERTIFICATE_BASE_URL:-http://localhost:8080}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${LANGCENTER_DATABASE_NAME:-langcenter};Username=langcenter;Password=langcenter-local"
    ports:
      - "${LANGCENTER_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: langcenter
      POSTGRES_USER: langcenter
      POSTGRES_PASSWORD: langcenter-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "langcenter", "-d", "langcenter"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
